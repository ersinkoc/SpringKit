name: Release

# Publishes to npm when a version tag (e.g. v2.0.0) is pushed.
# Authentication: either configure npm "Trusted Publishing" for this
# repository/workflow on npmjs.com (no secret needed), or add an NPM_TOKEN
# repository secret (an automation token).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs typecheck, lint, build and all tests
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm run lint:package
