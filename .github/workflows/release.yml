name: Release
run-name: Release ${{ github.ref_name }}${{ inputs.request_id && format(' · request {0}', inputs.request_id) || '' }}

# npm Trusted Publisher: ersinkoc/SpringKit, release.yml, direct publish allowed.
# Manual retries must select the same version tag, never a branch.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      request_id:
        description: Internal Start Release request (leave empty for a tag retry)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: springkit-release-publication
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current main version and an exact immutable tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Start new releases with Start Release on main; retry existing releases on their tag')
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), process.env.GITHUB_SHA)
          const main = JSON.parse(execFileSync('git', ['show', 'origin/main:package.json'], {encoding:'utf8'}))
          assert.equal(main.version, pkg.version, 'An older release must not overwrite the current npm/site release')
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main'])
          NODE

  validate:
    needs: identity
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Use the reviewed OIDC-capable npm CLI
        run: npm install --global npm@12.2.2 --registry=https://registry.npmjs.org/

      - name: Check that the tag matches package.json
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo 'Run releases from a version tag, including manual retries.' >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require token-free OIDC authentication
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo 'Release jobs must use npm Trusted Publishing, not stored npm tokens.' >&2
            exit 1
          fi
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/springkit-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/springkit-npmrc" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Detect an already uploaded matching version on retries
        id: publication
        run: node scripts/release-artifacts.mjs exists

      # The prepublishOnly lifecycle validates types, lint, build, tests and
      # the packed export/declaration shape BEFORE npm uploads anything.
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
        if: steps.publication.outputs.published != 'true'

  # A failed post-publication check can be rerun without uploading the same
  # immutable npm version again. This job only reads the public registry.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Use the reviewed signature-capable npm CLI
        run: npm install --global npm@12.2.2 --registry=https://registry.npmjs.org/

      - name: Use the public registry without an npm token
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/springkit-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/springkit-npmrc" >> "$GITHUB_ENV"

      - name: Verify registry version and provenance availability
        run: npm run verify:published

      - name: Verify signatures, source binding and clean registry consumers
        run: npm run test:published:provenance

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create release notes and verified npm archive assets
        run: node scripts/release-artifacts.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  website:
    needs: github-release
    uses: ./.github/workflows/deploy-website.yml
    permissions:
      contents: read
      pages: write
      id-token: write
