name: Deploy Website

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install root dependencies
        run: npm ci

      - name: Build SpringKit
        run: npm run build

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci

      - name: Build website
        working-directory: ./website
        run: npm run typecheck && npm run build && npm run test:routes

      - name: Add CNAME
        run: echo "springkit.oxog.dev" > website/dist/CNAME

      - name: Bind all live content checks to the release source
        run: node scripts/verify-site.mjs manifest

      - uses: actions/upload-artifact@v4
        with:
          name: site-release-manifest
          path: .temp_files/site-release-manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: site-release-manifest
          path: .temp_files
      - name: Verify the deployed version, routes and every script/style asset
        run: node scripts/verify-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-release-verification
          path: .temp_files/site-release-result.json
          if-no-files-found: ignore
